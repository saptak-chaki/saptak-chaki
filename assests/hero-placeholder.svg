<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="18" y="18" width="1064" height="194" rx="16"
        fill="url(#panel)" stroke="url(#neon)" stroke-width="2.2" filter="url(#glow)"/>

  <rect x="30" y="30" width="1040" height="170" rx="12"
        fill="none" stroke="#00F5FF" stroke-width="0.8" opacity="0.3"/>

  <!-- corner brackets -->
  <path d="M18 56 L18 18 L56 18" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M1082 56 L1082 18 L1044 18" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M18 174 L18 212 L56 212" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M1082 174 L1082 212 L1044 212" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>

  <!-- side accent bars -->
  <rect x="40" y="62" width="4" height="106" rx="2" fill="#00F5FF" opacity="0.85">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="1056" y="62" width="4" height="106" rx="2" fill="#FF2BD6" opacity="0.85">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- status dots -->
  <g filter="url(#soft)">
    <circle cx="68" cy="72" r="5" fill="#00F5FF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="115" r="5" fill="#168BFF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="158" r="5" fill="#FF2BD6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- thin scan line -->
  <rect x="95" y="44" width="910" height="1.4" fill="#00F5FF" opacity="0.4"/>

  <!-- main text -->
  <text x="550" y="84" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="36" font-weight="700" fill="#00F5FF" filter="url(#glow)">
    SAPTAK.exe
  </text>

  <text x="550" y="118" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="16" fill="#C9D4E5">
    SYSTEM STATUS: ONLINE  •  DRIVER ID: SAPTAK  •  ACCESS GRANTED
  </text>

  <text x="550" y="148" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#FF2BD6">
    PYTHON FULL STACK DEVELOPER // MIDNIGHT PROTOCOL
  </text>

  <text x="550" y="178" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#168BFF">
    IoT  •  CYBER SECURITY  •  BLOCKCHAIN
  </text>
</svg>

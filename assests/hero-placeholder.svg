<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>

    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- City skyline -->
  <g opacity="0.45" fill="#0D1528">
    <rect x="40" y="120" width="50" height="120"/>
    <rect x="100" y="90" width="40" height="150"/>
    <rect x="150" y="140" width="60" height="100"/>
    <rect x="220" y="70" width="45" height="170"/>
    <rect x="280" y="110" width="55" height="130"/>
    <rect x="850" y="100" width="50" height="140"/>
    <rect x="910" y="60" width="40" height="180"/>
    <rect x="960" y="120" width="70" height="120"/>
    <rect x="1040" y="80" width="45" height="160"/>
    <rect x="1100" y="130" width="60" height="110"/>
  </g>

  <!-- Neon windows -->
  <g opacity="0.7">
    <rect x="110" y="100" width="8" height="8" fill="#00F5FF"/>
    <rect x="130" y="130" width="8" height="8" fill="#FF2BD6"/>
    <rect x="230" y="90" width="8" height="8" fill="#00F5FF"/>
    <rect x="250" y="120" width="8" height="8" fill="#168BFF"/>
    <rect x="920" y="80" width="8" height="8" fill="#00F5FF"/>
    <rect x="980" y="140" width="8" height="8" fill="#FF2BD6"/>
    <rect x="1050" y="100" width="8" height="8" fill="#00F5FF"/>
  </g>

  <!-- Road -->
  <rect x="0" y="240" width="1200" height="80" fill="url(#road)"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#00F5FF" stroke-width="2" opacity="0.5"/>

  <!-- Road center dashes -->
  <g stroke="#C9D4E5" stroke-width="3" opacity="0.35">
    <line x1="40" y1="280" x2="100" y2="280"/>
    <line x1="140" y1="280" x2="200" y2="280"/>
    <line x1="240" y1="280" x2="300" y2="280"/>
    <line x1="340" y1="280" x2="400" y2="280"/>
    <line x1="440" y1="280" x2="500" y2="280"/>
    <line x1="540" y1="280" x2="600" y2="280"/>
    <line x1="640" y1="280" x2="700" y2="280"/>
    <line x1="740" y1="280" x2="800" y2="280"/>
    <line x1="840" y1="280" x2="900" y2="280"/>
    <line x1="940" y1="280" x2="1000" y2="280"/>
    <line x1="1040" y1="280" x2="1100" y2="280"/>
  </g>

  <!-- Car body (R34-inspired side silhouette) -->
  <g transform="translate(340, 175)" filter="url(#glow)">
    <!-- main body -->
    <path d="M40 70 L70 40 L160 28 L250 28 L310 42 L360 55 L390 70 L390 95 L40 95 Z"
          fill="#0B1220" stroke="#00F5FF" stroke-width="2.5"/>

    <!-- cabin -->
    <path d="M115 28 L145 8 L230 8 L255 28 Z"
          fill="#081018" stroke="#168BFF" stroke-width="2"/>

    <!-- windows -->
    <path d="M150 12 L175 12 L175 26 L150 26 Z" fill="#00F5FF" opacity="0.25"/>
    <path d="M185 12 L225 12 L240 26 L185 26 Z" fill="#00F5FF" opacity="0.25"/>

    <!-- headlights -->
    <ellipse cx="385" cy="72" rx="10" ry="6" fill="#F4F8FF" filter="url(#softGlow)"/>
    <ellipse cx="385" cy="72" rx="6" ry="3.5" fill="#00F5FF"/>

    <!-- taillights -->
    <rect x="42" y="66" width="14" height="6" rx="2" fill="#FF2BD6" filter="url(#softGlow)"/>

    <!-- side neon line -->
    <path d="M70 78 L360 78" stroke="url(#neon)" stroke-width="2" opacity="0.9"/>

    <!-- wheels -->
    <circle cx="110" cy="98" r="18" fill="#05070D" stroke="#C9D4E5" stroke-width="3"/>
    <circle cx="110" cy="98" r="8" fill="#168BFF" opacity="0.8"/>
    <circle cx="320" cy="98" r="18" fill="#05070D" stroke="#C9D4E5" stroke-width="3"/>
    <circle cx="320" cy="98" r="8" fill="#168BFF" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-family="Consolas, Monaco, monospace"
        font-size="42" font-weight="700" fill="#00F5FF" filter="url(#glow)">
    SAPTAK.exe
  </text>

  <text x="600" y="88" text-anchor="middle" font-family="Consolas, Monaco, monospace"
        font-size="18" fill="#FF2BD6">
    MIDNIGHT PROTOCOL
  </text>

  <text x="600" y="115" text-anchor="middle" font-family="Consolas, Monaco, monospace"
        font-size="14" fill="#C9D4E5">
    PYTHON FULL STACK DEVELOPER
  </text>

  <!-- Bottom border -->
  <rect x="20" y="20" width="1160" height="280" rx="14" fill="none"
        stroke="url(#neon)" stroke-width="2" opacity="0.7"/>
</svg>

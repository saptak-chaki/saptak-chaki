<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="480" viewBox="0 0 1400 480">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121822"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>

    <linearGradient id="tunnelGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- road dash pattern -->
    <pattern id="dashes" width="120" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="8" width="70" height="5" rx="2" fill="#D0D8E6" opacity="0.55"/>
      <animate attributeName="x" from="0" to="-120" dur="0.55s" repeatCount="indefinite"/>
    </pattern>

    <!-- side light streak pattern -->
    <pattern id="sideLights" width="180" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="10" width="28" height="8" rx="2" fill="#00F5FF" opacity="0.55"/>
      <rect x="60" y="10" width="18" height="8" rx="2" fill="#FF2BD6" opacity="0.45"/>
      <rect x="110" y="10" width="24" height="8" rx="2" fill="#168BFF" opacity="0.5"/>
      <animate attributeName="x" from="0" to="-180" dur="0.7s" repeatCount="indefinite"/>
    </pattern>

    <!-- soft crop for car shadow -->
    <linearGradient id="carFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="12%" stop-color="white" stop-opacity="1"/>
      <stop offset="88%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1400" height="480" fill="url(#sky)"/>

  <!-- tunnel walls -->
  <rect x="0" y="0" width="1400" height="95" fill="#0B101A"/>
  <rect x="0" y="0" width="1400" height="8" fill="#00F5FF" opacity="0.25"/>

  <!-- ceiling lights -->
  <g opacity="0.9">
    <g>
      <rect x="40" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <rect x="160" y="28" width="70" height="10" rx="3" fill="#00F5FF" opacity="0.45"/>
      <rect x="280" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <rect x="400" y="28" width="70" height="10" rx="3" fill="#00F5FF" opacity="0.45"/>
      <rect x="520" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <rect x="640" y="28" width="70" height="10" rx="3" fill="#00F5FF" opacity="0.45"/>
      <rect x="760" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <rect x="880" y="28" width="70" height="10" rx="3" fill="#00F5FF" opacity="0.45"/>
      <rect x="1000" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <rect x="1120" y="28" width="70" height="10" rx="3" fill="#00F5FF" opacity="0.45"/>
      <rect x="1240" y="28" width="70" height="10" rx="3" fill="#FF2BD6" opacity="0.55"/>
      <!-- move ceiling lights backward for speed feel -->
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- city/tunnel side glow -->
  <rect x="0" y="95" width="1400" height="30" fill="url(#tunnelGlow)"/>

  <!-- far road perspective base -->
  <path d="M0 250 L1400 250 L1400 480 L0 480 Z" fill="url(#road)"/>

  <!-- yellow lane edge -->
  <rect x="0" y="292" width="1400" height="6" fill="#E0B400" opacity="0.75"/>
  <rect x="0" y="430" width="1400" height="6" fill="#E0B400" opacity="0.35"/>

  <!-- moving center dashes -->
  <rect x="0" y="355" width="1400" height="20" fill="url(#dashes)"/>

  <!-- side neon wall lights (moving) -->
  <rect x="0" y="250" width="1400" height="24" fill="url(#sideLights)" opacity="0.8"/>
  <rect x="0" y="450" width="1400" height="18" fill="url(#sideLights)" opacity="0.35"/>

  <!-- wet road reflection glow under car path -->
  <ellipse cx="720" cy="400" rx="380" ry="28" fill="#00F5FF" opacity="0.08">
    <animate attributeName="cx" values="680;760;680" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="720" cy="400" rx="220" ry="16" fill="#FF2BD6" opacity="0.06"/>

  <!-- speed lines -->
  <g stroke="#00F5FF" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="40" y1="220" x2="160" y2="220">
      <animate attributeName="x1" values="40;0;40" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="160;100;160" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="200" x2="320" y2="200">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="0.35s" repeatCount="indefinite"/>
    </line>
    <line x1="1100" y1="210" x2="1240" y2="210">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="0.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ========== YOUR REAL CAR IMAGE (moves on road) ========== -->
  <!-- shadow -->
  <ellipse cx="720" cy="418" rx="260" ry="18" fill="#000000" opacity="0.55">
    <animate attributeName="cx" values="720;728;712;720" dur="0.25s" repeatCount="indefinite"/>
  </ellipse>

  <!-- car group: slight forward surge + vibration -->
  <g>
    <!-- vibration -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 1.2; 0 0; 0 -1; 0 0"
      dur="0.16s" repeatCount="indefinite"/>

    <!-- main driving motion (loop on road) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-380 0; 0 0; 380 0"
        keyTimes="0; 0.5; 1"
        dur="6s"
        calcMode="spline"
        keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1"
        repeatCount="indefinite"/>

      <!-- YOUR CAR IMAGE -->
      <image
        href="./hero-r34.png"
        x="420"
        y="120"
        width="600"
        height="320"
        preserveAspectRatio="xMidYMid meet"
        opacity="0.98"/>
    </g>
  </g>

  <!-- underglow fake neon under bumper -->
  <ellipse cx="720" cy="395" rx="180" ry="12" fill="#00F5FF" opacity="0.18" filter="url(#soft)">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- top title -->
  <g filter="url(#glow)">
    <text x="700" y="58" text-anchor="middle"
          font-family="Consolas, 'Courier New', monospace"
          font-size="34" font-weight="700" fill="#00F5FF">
      SAPTAK.exe
    </text>
  </g>
  <text x="700" y="86" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#FF2BD6">
    MIDNIGHT PROTOCOL // R34 ON THE ROAD
  </text>

  <!-- HUD frame -->
  <rect x="16" y="12" width="1368" height="456" rx="16" fill="none"
        stroke="url(#neon)" stroke-width="2.2" opacity="0.7"/>
  <path d="M16 52 L16 12 L56 12" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M1384 52 L1384 12 L1344 12" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M16 428 L16 468 L56 468" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>
  <path d="M1384 428 L1384 468 L1344 468" fill="none" stroke="#FF2BD6" stroke-width="3.5"/>

  <!-- status chips -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="40" y="440" width="170" height="22" rx="6" fill="#05070D" stroke="#00F5FF" stroke-width="1.2"/>
    <text x="125" y="455" text-anchor="middle" fill="#00F5FF">SYSTEM: ONLINE</text>

    <rect x="230" y="440" width="180" height="22" rx="6" fill="#05070D" stroke="#FF2BD6" stroke-width="1.2"/>
    <text x="320" y="455" text-anchor="middle" fill="#FF2BD6">DRIVER: SAPTAK</text>

    <rect x="1190" y="440" width="170" height="22" rx="6" fill="#05070D" stroke="#168BFF" stroke-width="1.2"/>
    <text x="1275" y="455" text-anchor="middle" fill="#168BFF">SPEED: NIGHT</text>
  </g>
</svg>

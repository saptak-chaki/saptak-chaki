<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="45%" stop-color="#070B16"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="bodyPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2333"/>
      <stop offset="35%" stop-color="#0E1522"/>
      <stop offset="70%" stop-color="#0A101A"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>

    <linearGradient id="bodyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3A52" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#101826" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3048"/>
      <stop offset="50%" stop-color="#0B1522"/>
      <stop offset="100%" stop-color="#060C14"/>
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>

    <linearGradient id="headlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#168BFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wheelMetal" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8A97AB"/>
      <stop offset="45%" stop-color="#3A4558"/>
      <stop offset="100%" stop-color="#12161F"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="headlightBloom" x="-50%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- Wheel spoke group for rotation -->
    <g id="wheelSpokes">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#9AA8BC" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#5A6A80" stroke-width="1.4"/>
      <g stroke="#C9D4E5" stroke-width="2.4" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="16"/>
        <line x1="-14" y1="-8" x2="14" y2="8"/>
        <line x1="-14" y1="8" x2="14" y2="-8"/>
        <line x1="-16" y1="0" x2="16" y2="0"/>
      </g>
      <circle cx="0" cy="0" r="6.5" fill="#0A0E16" stroke="#00F5FF" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.8" fill="#168BFF"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1400" height="420" fill="url(#bgGrad)"/>

  <!-- Far city haze -->
  <ellipse cx="700" cy="210" rx="700" ry="90" fill="#0A1428" opacity="0.35"/>

  <!-- Skyline buildings (back) -->
  <g fill="#0A1220" opacity="0.85">
    <rect x="20" y="110" width="48" height="150"/>
    <rect x="72" y="80" width="36" height="180"/>
    <rect x="114" y="130" width="58" height="130"/>
    <rect x="180" y="70" width="42" height="190"/>
    <rect x="228" y="105" width="50" height="155"/>
    <rect x="286" y="88" width="34" height="172"/>
    <rect x="1050" y="95" width="44" height="165"/>
    <rect x="1100" y="60" width="38" height="200"/>
    <rect x="1145" y="120" width="62" height="140"/>
    <rect x="1215" y="75" width="40" height="185"/>
    <rect x="1265" y="100" width="55" height="160"/>
    <rect x="1330" y="88" width="36" height="172"/>
  </g>

  <!-- Neon windows -->
  <g>
    <rect x="80" y="100" width="6" height="7" fill="#00F5FF" opacity="0.75"/>
    <rect x="92" y="130" width="6" height="7" fill="#FF2BD6" opacity="0.65"/>
    <rect x="190" y="95" width="6" height="7" fill="#00F5FF" opacity="0.7"/>
    <rect x="240" y="120" width="6" height="7" fill="#168BFF" opacity="0.7"/>
    <rect x="1110" y="90" width="6" height="7" fill="#00F5FF" opacity="0.75"/>
    <rect x="1160" y="140" width="6" height="7" fill="#FF2BD6" opacity="0.6"/>
    <rect x="1230" y="110" width="6" height="7" fill="#00F5FF" opacity="0.7"/>
  </g>

  <!-- Wet road -->
  <rect x="0" y="300" width="1400" height="120" fill="url(#roadGrad)"/>
  <rect x="0" y="300" width="1400" height="2" fill="#00F5FF" opacity="0.35"/>

  <!-- Road reflection glow -->
  <ellipse cx="700" cy="350" rx="420" ry="28" fill="#00F5FF" opacity="0.06"/>
  <ellipse cx="700" cy="350" rx="280" ry="16" fill="#FF2BD6" opacity="0.04"/>

  <!-- Lane dashes (subtle motion feel via pattern positions) -->
  <g stroke="#8A97AB" stroke-width="4" opacity="0.28" stroke-linecap="round">
    <line x1="40" y1="360" x2="110" y2="360"/>
    <line x1="160" y1="360" x2="230" y2="360"/>
    <line x1="280" y1="360" x2="350" y2="360"/>
    <line x1="400" y1="360" x2="470" y2="360"/>
    <line x1="520" y1="360" x2="590" y2="360"/>
    <line x1="640" y1="360" x2="710" y2="360"/>
    <line x1="760" y1="360" x2="830" y2="360"/>
    <line x1="880" y1="360" x2="950" y2="360"/>
    <line x1="1000" y1="360" x2="1070" y2="360"/>
    <line x1="1120" y1="360" x2="1190" y2="360"/>
    <line x1="1240" y1="360" x2="1310" y2="360"/>
  </g>

  <!-- ========== REALISTIC R34-INSPIRED CAR ========== -->
  <g transform="translate(290, 145)" filter="url(#shadow)">

    <!-- Ground shadow under car -->
    <ellipse cx="410" cy="198" rx="300" ry="16" fill="#000000" opacity="0.55"/>

    <!-- Rear bumper + lower diffuser area -->
    <path d="M70 155
             C60 155 52 148 52 140
             L52 128
             C52 120 58 114 70 114
             L95 114
             L95 155 Z"
          fill="#0A0E16" stroke="#1A2333" stroke-width="1.5"/>

    <!-- Main chassis / rocker -->
    <path d="M90 150
             L120 158
             L250 162
             L520 158
             L680 150
             L720 142
             L730 130
             L728 118
             L90 125 Z"
          fill="#080C14" stroke="#151C28" stroke-width="1"/>

    <!-- Main body side profile (R34 long nose + cabin + rear haunch) -->
    <path d="M78 130
             L95 95
             L130 78
             L210 68
             L300 62
             L390 60
             L470 62
             L530 70
             L580 88
             L620 108
             L680 118
             L740 122
             L765 128
             L775 138
             L772 150
             L760 158
             L700 164
             L520 168
             L300 168
             L160 164
             L100 158
             L82 148 Z"
          fill="url(#bodyPaint)" stroke="#00F5FF" stroke-width="1.8" opacity="0.98"/>

    <!-- Body highlight stripe (paint reflection) -->
    <path d="M110 100
             L220 84
             L400 78
             L540 88
             L650 112
             L720 124
             L730 128
             L650 118
             L540 96
             L400 88
             L220 94
             L120 108 Z"
          fill="url(#bodyHighlight)" opacity="0.55"/>

    <!-- Hood shutlines -->
    <path d="M560 92 L720 118" fill="none" stroke="#2A3548" stroke-width="1.2" opacity="0.8"/>
    <path d="M580 100 L735 128" fill="none" stroke="#1A2434" stroke-width="1" opacity="0.7"/>

    <!-- Front bumper lip -->
    <path d="M730 145
             L770 138
             L780 142
             L778 152
             L760 160
             L730 158 Z"
          fill="#0A0E16" stroke="#00F5FF" stroke-width="1.2" opacity="0.9"/>

    <!-- A-pillar + roof + C-pillar cabin -->
    <path d="M250 70
             L295 28
             L455 24
             L545 32
             L585 72
             L560 78
             L470 70
             L310 72 Z"
          fill="#0A1018" stroke="#168BFF" stroke-width="1.6"/>

    <!-- Roof top edge -->
    <path d="M300 28 L450 24 L535 30" fill="none" stroke="#00F5FF" stroke-width="1.2" opacity="0.55"/>

    <!-- Windshield -->
    <path d="M305 70
             L325 34
             L410 30
             L430 68 Z"
          fill="url(#glassGrad)" stroke="#3A6A88" stroke-width="1.2"/>
    <path d="M318 55 L405 50" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.25"/>

    <!-- Side window -->
    <path d="M438 68
             L445 32
             L520 34
             L555 70
             L530 74
             L460 72 Z"
          fill="url(#glassGrad)" stroke="#3A6A88" stroke-width="1.2"/>
    <path d="M455 50 L530 50" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.2"/>

    <!-- B-pillar -->
    <path d="M430 32 L438 72 L455 72 L448 32 Z" fill="#0A0E16" stroke="#1A2838" stroke-width="1"/>

    <!-- Side mirror -->
    <path d="M575 78 L598 72 L602 82 L580 88 Z" fill="#121822" stroke="#00F5FF" stroke-width="1.1"/>
    <circle cx="596" cy="78" r="2.2" fill="#00F5FF" opacity="0.8"/>

    <!-- Door character line -->
    <path d="M250 118 L560 112 L650 120" fill="none" stroke="#2A3A50" stroke-width="1.6" opacity="0.85"/>
    <path d="M250 118 L560 112 L650 120" fill="none" stroke="#00F5FF" stroke-width="0.6" opacity="0.35"/>

    <!-- Lower side skirt neon -->
    <path d="M120 158 L250 164 L520 164 L700 156"
          fill="none" stroke="url(#neonLine)" stroke-width="2.2" filter="url(#glow)" opacity="0.9"/>

    <!-- Rear fender haunch line (GT-R muscle) -->
    <path d="M140 100
             C180 86 220 92 250 108
             C230 120 190 128 150 122 Z"
          fill="#101826" opacity="0.55"/>

    <!-- Front fender arch bulge -->
    <path d="M620 108
             C660 96 710 108 740 128
             C700 138 650 132 620 122 Z"
          fill="#101826" opacity="0.45"/>

    <!-- GT-R style rear spoiler / wing -->
    <path d="M145 58
             L155 48
             L235 44
             L245 52
             L240 58
             L155 62 Z"
          fill="#0C121C" stroke="#00F5FF" stroke-width="1.4"/>
    <!-- wing stands -->
    <path d="M175 62 L178 78" stroke="#4A5A70" stroke-width="3" stroke-linecap="round"/>
    <path d="M215 60 L218 76" stroke="#4A5A70" stroke-width="3" stroke-linecap="round"/>

    <!-- Tail lights (R34 style bar-ish) -->
    <g filter="url(#softGlow)">
      <rect x="72" y="108" width="28" height="8" rx="2" fill="#FF1A4A"/>
      <rect x="72" y="108" width="28" height="8" rx="2" fill="#FF2BD6" opacity="0.85"/>
      <rect x="74" y="110" width="10" height="4" rx="1" fill="#FFB0D8" opacity="0.9"/>
    </g>

    <!-- Headlights (quad-inspired cluster simplified) -->
    <g filter="url(#headlightBloom)">
      <ellipse cx="755" cy="128" rx="16" ry="10" fill="#E8FFFF" opacity="0.9"/>
      <ellipse cx="758" cy="128" rx="9" ry="6" fill="#00F5FF"/>
      <ellipse cx="760" cy="128" rx="4" ry="3" fill="#FFFFFF"/>
    </g>
    <!-- headlight beam -->
    <path d="M770 128 L920 110 L940 145 L770 140 Z"
          fill="url(#headlightGrad)" opacity="0.22"/>

    <!-- Front grille hint -->
    <path d="M742 140 L772 136 L774 146 L744 150 Z" fill="#05070D" stroke="#2A3548" stroke-width="1"/>

    <!-- Door handle -->
    <rect x="470" y="104" width="18" height="4" rx="1.5" fill="#1A2433" stroke="#00F5FF" stroke-width="0.7" opacity="0.8"/>

    <!-- Fuel cap -->
    <circle cx="200" cy="108" r="5" fill="#0A0E16" stroke="#3A4A60" stroke-width="1.2"/>

    <!-- Brake caliper hints behind wheels (visible gap) -->
    <rect x="198" y="168" width="10" height="14" rx="2" fill="#FF2BD6" opacity="0.45"/>
    <rect x="618" y="168" width="10" height="14" rx="2" fill="#FF2BD6" opacity="0.45"/>

    <!-- ========== WHEELS (animated) ========== -->
    <!-- Rear tire -->
    <g transform="translate(210, 168)">
      <ellipse cx="0" cy="8" rx="34" ry="8" fill="#000" opacity="0.35"/>
      <circle cx="0" cy="0" r="30" fill="#0A0C10" stroke="#1A1F28" stroke-width="4"/>
      <circle cx="0" cy="0" r="26" fill="#12151C" stroke="#2A303C" stroke-width="2"/>
      <!-- rotating spokes -->
      <g>
        <use href="#wheelSpokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.7s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00F5FF" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Front tire -->
    <g transform="translate(640, 168)">
      <ellipse cx="0" cy="8" rx="34" ry="8" fill="#000" opacity="0.35"/>
      <circle cx="0" cy="0" r="30" fill="#0A0C10" stroke="#1A1F28" stroke-width="4"/>
      <circle cx="0" cy="0" r="26" fill="#12151C" stroke="#2A303C" stroke-width="2"/>
      <g>
        <use href="#wheelSpokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.7s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00F5FF" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Wheel arch outlines -->
    <path d="M160 145 C160 145 170 195 210 198 C250 195 260 145 260 145"
          fill="none" stroke="#2A3548" stroke-width="2.2"/>
    <path d="M590 145 C590 145 600 195 640 198 C680 195 690 145 690 145"
          fill="none" stroke="#2A3548" stroke-width="2.2"/>

    <!-- Subtle engine vibration (whole car) -->
    <animateTransform attributeName="transform" type="translate"
      values="290,145; 290,146; 290,145; 290,144; 290,145"
      dur="0.18s" repeatCount="indefinite"/>
  </g>

  <!-- Title block -->
  <g filter="url(#glow)">
    <text x="700" y="48" text-anchor="middle"
          font-family="Consolas, 'Courier New', monospace"
          font-size="40" font-weight="700" fill="#00F5FF">
      SAPTAK.exe
    </text>
  </g>
  <text x="700" y="78" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="16" fill="#FF2BD6">
    MIDNIGHT PROTOCOL // NISSAN SKYLINE GT-R R34 INSPIRED
  </text>
  <text x="700" y="102" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#C9D4E5">
    PYTHON FULL STACK DEVELOPER
  </text>

  <!-- Outer neon frame -->
  <rect x="18" y="14" width="1364" height="392" rx="16" fill="none"
        stroke="url(#neonLine)" stroke-width="2" opacity="0.65"/>
  <!-- corner ticks -->
  <path d="M18 50 L18 14 L54 14" fill="none" stroke="#FF2BD6" stroke-width="3"/>
  <path d="M1382 50 L1382 14 L1346 14" fill="none" stroke="#FF2BD6" stroke-width="3"/>
  <path d="M18 370 L18 406 L54 406" fill="none" stroke="#FF2BD6" stroke-width="3"/>
  <path d="M1382 370 L1382 406 L1346 406" fill="none" stroke="#FF2BD6" stroke-width="3"/>
</svg>

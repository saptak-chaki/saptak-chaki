<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes vibration { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes wheelRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes lightFlicker { 0%, 90%, 100% { opacity: 1; } 92%, 96% { opacity: 0.4; } }
    @keyframes backfire { 0%, 90% { opacity: 0; transform: scale(0.5); } 93% { opacity: 1; transform: scale(1.4); } 95% { opacity: 0; } }
    @keyframes hudBar { 0% { width: 100px; } 50% { width: 300px; } 100% { width: 100px; } }
    
    .car-group { animation: vibration 0.15s infinite; }
    .wheel { transform-origin: center; animation: wheelRotate 0.4s linear infinite; transform-box: fill-box; }
    .headlight { animation: lightFlicker 3s infinite; filter: url(#glow); }
    .fire { animation: backfire 0.7s infinite; filter: url(#glow); }
    .hud-text { font-family: 'Segoe UI', monospace; fill: #00ffff; filter: url(#glow); }
    .progress-bar { animation: hudBar 4s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1000" height="500" fill="#050505" />
  <rect x="0" y="320" width="1000" height="180" fill="url(#roadGrad)" />
  
  <!-- AE86 Vector Body -->
  <g class="car-group">
    <!-- Main Body Shape -->
    <path d="M150 320 L750 320 L730 250 L500 240 L300 240 L180 290 Z" fill="#ffffff" stroke="#000" stroke-width="2" />
    <path d="M180 290 L740 290 L735 320 L165 320 Z" fill="#1a1a1a" /> <!-- Black Trueno Stripe -->
    
    <!-- Windows -->
    <path d="M320 250 L480 250 L470 280 L310 280 Z" fill="#002233" />
    <path d="M500 250 L650 250 L670 280 L495 280 Z" fill="#002233" />

    <!-- Headlights -->
    <rect x="710" y="295" width="35" height="15" fill="#00ffff" class="headlight" />
    
    <!-- Wheels (Simplified Vector) -->
    <g class="wheel" style="transform-origin: 280px 320px;">
        <circle cx="280" cy="320" r="35" fill="#111" stroke="#444" stroke-width="4" />
        <path d="M280 285 L280 355 M245 320 L315 320" stroke="#555" stroke-width="2" />
    </g>
    <g class="wheel" style="transform-origin: 620px 320px;">
        <circle cx="620" cy="320" r="35" fill="#111" stroke="#444" stroke-width="4" />
        <path d="M620 285 L620 355 M585 320 L655 320" stroke="#555" stroke-width="2" />
    </g>

    <!-- Exhaust Backfire -->
    <circle cx="140" cy="315" r="15" fill="#ff4400" class="fire" />
    <circle cx="140" cy="315" r="8" fill="#ffff00" class="fire" />
  </g>

  <!-- Cyber HUD Dashboard -->
  <g transform="translate(0, 380)">
    <rect width="1000" height="120" fill="rgba(0,15,25,0.9)" stroke="#00ffff" stroke-width="2" />
    
    <!-- Gauges -->
    <circle cx="100" cy="60" r="40" stroke="#1a3333" stroke-width="5" fill="none" />
    <path d="M70 85 A 40 40 0 0 1 130 85" stroke="#00ffff" stroke-width="4" fill="none" />
    
    <!-- Info -->
    <text x="180" y="45" class="hud-text" font-size="24" font-weight="bold">SAPTAK.exe // SYSTEM_ONLINE</text>
    <text x="180" y="75" class="hud-text" font-size="14" opacity="0.8">B.TECH CSE • IoT • BLOCKCHAIN • CYBER SECURITY</text>
    
    <!-- Progress Bar -->
    <rect x="180" y="90" width="350" height="6" fill="#112222" />
    <rect x="180" y="90" width="200" height="6" fill="#00ffff" class="progress-bar" />

    <!-- Right Side Stats -->
    <text x="750" y="45" class="hud-text" font-size="14">ENGINE: TRUENO 4A-GE</text>
    <text x="750" y="70" class="hud-text" font-size="14">NETWORK: ENCRYPTED</text>
    <text x="750" y="95" class="hud-text" font-size="14">LATENCY: 0.02ms</text>
  </g>
</svg>

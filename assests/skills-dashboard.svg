<svg width="600" height="1200" viewBox="0 0 600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- নিওন গ্লো এবং গ্রেডিয়েন্ট -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#160f29;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes vibration { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(1px, 1px); } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } 80% { opacity: 0.9; } }
    @keyframes rotateWheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    @keyframes fillBar { from { width: 0%; } to { width: 70%; } }

    .car-container { animation: vibration 0.2s infinite; }
    .neon-border { fill: none; stroke: url(#boxGrad); stroke-width: 2; filter: url(#neonGlow); }
    .headlight-glow { fill: #00ffff; filter: url(#neonGlow); animation: flicker 2s infinite; }
    .gauge-needle { transform-origin: center; animation: rotateWheel 4s ease-in-out infinite alternate; }
    .skill-bar { animation: fillBar 2s ease-out forwards; }
    .hud-text { font-family: 'Courier New', monospace; fill: #ff007f; filter: url(#neonGlow); }
  </style>

  <!-- ব্যাকগ্রাউন্ড -->
  <rect width="600" height="1200" fill="#0d0221" />

  <!-- ১. মেইন কার সেকশন (AE86 Top) -->
  <g class="car-container">
    <clipPath id="carClip">
      <rect x="20" y="20" width="560" height="380" rx="20" />
    </clipPath>
    <image href="https://raw.githubusercontent.com/saptak-chaki/saptak-chaki1/main/assests/sddefault.jpg" 
           x="20" y="20" width="560" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#carClip)" />
    
    <!-- হেডলাইট ফ্লিকার -->
    <circle cx="95" cy="215" r="25" class="headlight-glow" opacity="0.6" />
    <circle cx="270" cy="225" r="25" class="headlight-glow" opacity="0.6" />
  </g>

  <!-- ২. স্ট্যাটাস বক্স (Empty Box in Image) -->
  <rect x="20" y="420" width="560" height="80" rx="10" class="neon-border" stroke="#ff007f" />
  <text x="50" y="470" class="hud-text" font-size="24">SYSTEM STATUS: ONLINE (SAPTAK.exe)</text>

  <!-- ৩. গজ সেকশন (Four Dials) -->
  <rect x="20" y="520" width="560" height="100" rx="10" class="neon-border" stroke="#7000ff" />
  <g transform="translate(80, 570)">
    <circle r="35" fill="none" stroke="#333" stroke-width="3" />
    <circle r="3" fill="#ff007f" />
    <line x1="0" y1="0" x2="25" y2="0" stroke="#ff007f" stroke-width="2" class="gauge-needle" />
  </g>
  <g transform="translate(225, 570)">
    <circle r="35" fill="none" stroke="#333" stroke-width="3" />
    <circle r="3" fill="#00ffff" />
    <line x1="0" y1="0" x2="25" y2="0" stroke="#00ffff" stroke-width="2" class="gauge-needle" />
  </g>
  <g transform="translate(375, 570)">
    <circle r="35" fill="none" stroke="#333" stroke-width="3" />
    <circle r="3" fill="#ccff00" />
    <line x1="0" y1="0" x2="25" y2="0" stroke="#ccff00" stroke-width="2" class="gauge-needle" />
  </g>
  <g transform="translate(520, 570)">
    <circle r="35" fill="none" stroke="#333" stroke-width="3" />
    <circle r="3" fill="#ff4400" />
    <line x1="0" y1="0" x2="25" y2="0" stroke="#ff4400" stroke-width="2" class="gauge-needle" />
  </g>

  <!-- ৪. হুইল ও স্কিল বার সেকশন -->
  <rect x="20" y="640" width="560" height="180" rx="10" class="neon-border" stroke="#00ffff" />
  <!-- এনিমেটেড হুইল -->
  <g transform="translate(100, 730)">
    <circle r="60" fill="none" stroke="#ff007f" stroke-width="8" />
    <g style="animation: rotateWheel 2s linear infinite; transform-origin: center;">
      <circle r="50" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="10,5" />
      <path d="M-40 0 L40 0 M0 -40 L0 40" stroke="#00ffff" stroke-width="2" />
    </g>
  </g>
  <!-- স্কিল বারগুলো -->
  <g transform="translate(250, 680)">
    <rect x="0" y="10" width="280" height="10" rx="5" fill="#1a1a1a" />
    <rect x="0" y="10" width="200" height="10" rx="5" fill="#ff007f" class="skill-bar" />
    
    <rect x="0" y="40" width="280" height="10" rx="5" fill="#1a1a1a" />
    <rect x="0" y="40" width="150" height="10" rx="5" fill="#00ffff" class="skill-bar" />
    
    <rect x="0" y="70" width="280" height="10" rx="5" fill="#1a1a1a" />
    <rect x="0" y="70" width="180" height="10" rx="5" fill="#5555ff" class="skill-bar" />
  </g>

  <!-- ৫. গ্রিড আইটেমস (Tech Inventory) -->
  <rect x="20" y="840" width="560" height="120" rx="10" class="neon-border" stroke="#ffaa00" />
  <g transform="translate(40, 860)">
     <rect width="120" height="30" rx="15" fill="none" stroke="#ff007f" opacity="0.5" />
     <rect x="135" width="120" height="30" rx="15" fill="none" stroke="#00ffff" opacity="0.5" />
     <rect x="270" width="120" height="30" rx="15" fill="none" stroke="#ccff00" opacity="0.5" />
     <rect x="405" width="120" height="30" rx="15" fill="none" stroke="#ff4400" opacity="0.5" />
     
     <rect y="40" width="120" height="30" rx="15" fill="none" stroke="#00ffff" />
     <rect x="135" y="40" width="120" height="30" rx="15" fill="none" stroke="#ff007f" />
  </g>

  <!-- ৬. ফুটার (Social Icons) -->
  <rect x="20" y="980" width="560" height="40" rx="5" fill="#2d1b4d" />
  <circle cx="300" cy="1000" r="10" fill="#fff" class="status-blink" style="animation: pulse 1.5s infinite;" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="18" height="2200" viewBox="0 0 18 2200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="y1" values="0;-1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="18" height="2200" rx="9" fill="url(#metal)"/>
  <rect x="4" y="6" width="10" height="2188" rx="5" fill="url(#rgb)" filter="url(#glow)"/>
  <rect x="4" y="6" width="4" height="2188" rx="2" fill="#ffffff" opacity="0.25"/>
</svg>

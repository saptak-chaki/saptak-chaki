<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36">
  <defs>
    <linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;-100%" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="45%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-2%" y="-80%" width="104%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="1200" height="20" rx="10" fill="url(#metal)" stroke="#2c2c2c"/>
  <rect x="8" y="12" width="1184" height="12" rx="6" fill="url(#rgb)" filter="url(#glow)"/>
  <rect x="8" y="12" width="1184" height="4" rx="2" fill="#ffffff" opacity="0.28"/>
</svg>

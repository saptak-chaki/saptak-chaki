<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <defs>
    <linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="25%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="75%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-4%" y="-8%" width="108%" height="116%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="380" rx="24" fill="#070709"/>
  <rect x="10" y="10" width="900" height="360" rx="20" fill="none" stroke="url(#rgb)" stroke-width="5" filter="url(#glow)"/>
  <rect x="10" y="10" width="900" height="360" rx="20" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="70 980" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-1050" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="22" width="876" height="336" rx="16" fill="#101014"/>

  <text x="460" y="58" text-anchor="middle" fill="#7ee7ff" font-size="13" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-weight="700" letter-spacing="3">ABOUT ME</text>
  <text x="460" y="112" text-anchor="middle" fill="#ffffff" font-size="52" font-family="Impact, 'Arial Black', sans-serif" letter-spacing="3">HelLGuY</text>
  <text x="460" y="150" text-anchor="middle" fill="#ff2e63" font-size="24" font-family="Impact, 'Arial Black', sans-serif" letter-spacing="1">welcome to HELLL GUYSSSS</text>

  <rect x="330" y="170" width="260" height="3" rx="1.5" fill="url(#rgb)"/>

  <text x="460" y="210" text-anchor="middle" fill="#f2f2f2" font-size="17" font-family="'Segoe UI', Verdana, Arial, sans-serif">I'm HelLGuY — an aspiring Python Full Stack Developer.</text>
  <text x="460" y="238" text-anchor="middle" fill="#d8d8d8" font-size="17" font-family="'Segoe UI', Verdana, Arial, sans-serif">I build the backend, the interface, and the details in between.</text>
  <text x="460" y="266" text-anchor="middle" fill="#d8d8d8" font-size="17" font-family="'Segoe UI', Verdana, Arial, sans-serif">Python, HTML, and CSS — learning in public, one commit at a time.</text>

  <text x="190" y="322" text-anchor="middle" fill="#ff4d8d" font-size="13" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-weight="700">FOCUS</text>
  <text x="190" y="344" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Segoe UI', Verdana, Arial, sans-serif">Python Full Stack</text>
  <text x="460" y="322" text-anchor="middle" fill="#ffea00" font-size="13" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-weight="700">NOW</text>
  <text x="460" y="344" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Segoe UI', Verdana, Arial, sans-serif">Python · HTML · CSS</text>
  <text x="730" y="322" text-anchor="middle" fill="#00e5ff" font-size="13" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-weight="700">GOAL</text>
  <text x="730" y="344" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Segoe UI', Verdana, Arial, sans-serif">Build · Learn · Ship</text>
</svg>

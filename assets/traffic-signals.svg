<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="32" rx="6" fill="url(#metal)"/>

  <!-- Red Light -->
  <circle cx="200" cy="16" r="9" fill="#ff1744">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Yellow Light -->
  <circle cx="600" cy="16" r="9" fill="#ffea00">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Green Light -->
  <circle cx="1000" cy="16" r="9" fill="#00e676">
    <animate attributeName="opacity" values="0.15;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>

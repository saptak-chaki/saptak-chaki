<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590">
  <defs>
    <radialGradient id="metal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="30%" stop-color="#777"/>
      <stop offset="70%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="500" height="590" rx="22" fill="#090909"/>

  <text x="250" y="38" text-anchor="middle" fill="#00e5ff"
        font-size="22" font-family="monospace" font-weight="bold">
    JDM LANGUAGE RIM
  </text>

  <!-- Tire -->
  <circle cx="250" cy="250" r="205" fill="#111" stroke="#000" stroke-width="10" filter="url(#shadow)"/>

  <!-- Language-colored outer rim -->
  <path d="M 250.00 72.00 A 178 178 0 1 1 243.79 72.11" fill="none" stroke="#3776AB" stroke-width="25" stroke-linecap="round"/>

  <!-- Metallic wheel -->
  <circle cx="250" cy="250" r="150" fill="url(#metal)" stroke="#555" stroke-width="5"/>

  <!-- JDM spokes -->
  <line x1="250" y1="250" x2="375.0" y2="250.0" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="338.4" y2="338.4" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="250.0" y2="375.0" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="161.6" y2="338.4" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="125.0" y2="250.0" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="161.6" y2="161.6" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="250.0" y2="125.0" stroke="#303030" stroke-width="15" stroke-linecap="round"/><line x1="250" y1="250" x2="338.4" y2="161.6" stroke="#303030" stroke-width="15" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="250" cy="250" r="58" fill="#101010" stroke="#00e5ff" stroke-width="4"/>
  <circle cx="250" cy="250" r="35" fill="#252525" stroke="#777" stroke-width="3"/>

  <text x="250" y="246" text-anchor="middle" fill="#ffffff"
        font-size="16" font-family="monospace" font-weight="bold">CODE</text>
  <text x="250" y="267" text-anchor="middle" fill="#00e5ff"
        font-size="13" font-family="monospace">RPM</text>

  <text x="250" y="405" text-anchor="middle" fill="#bbbbbb"
        font-size="14" font-family="monospace">
    AUTO-GENERATED FROM YOUR REPOSITORIES
  </text>

  <circle cx="105" cy="435" r="7" fill="#3776AB"/><text x="122" y="440" fill="#f5f5f5" font-size="16" font-family="monospace">Python: 100%</text>
</svg>
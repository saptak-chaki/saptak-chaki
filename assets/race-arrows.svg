<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="28" rx="6" fill="url(#metal)"/>

  <!-- Moving Arrows -->
  <g>
    <!-- Red -->
    <polygon points="40,14 70,6 70,22" fill="#ff1744">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1200 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Orange -->
    <polygon points="40,14 70,6 70,22" fill="#ff9100">
      <animateTransform attributeName="transform" type="translate" values="-200 0; 1000 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Yellow -->
    <polygon points="40,14 70,6 70,22" fill="#ffea00">
      <animateTransform attributeName="transform" type="translate" values="-400 0; 800 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Green -->
    <polygon points="40,14 70,6 70,22" fill="#00e676">
      <animateTransform attributeName="transform" type="translate" values="-600 0; 600 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Cyan -->
    <polygon points="40,14 70,6 70,22" fill="#00e5ff">
      <animateTransform attributeName="transform" type="translate" values="-800 0; 400 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Purple -->
    <polygon points="40,14 70,6 70,22" fill="#7c4dff">
      <animateTransform attributeName="transform" type="translate" values="-1000 0; 200 0" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
